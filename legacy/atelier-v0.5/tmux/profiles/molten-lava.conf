# Nocturne / Molten Lava. Static tmux styles; no automatic daemon or shell edit.
# Use in an isolated preview server first. Requires tmux with hex-color styles.
# RGB negotiation belongs to your actual outer terminal; see docs/TMUX.md.
set -g default-terminal "tmux-256color"
set -g mouse on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#100b0b,fg=#e2d9c9"
set -g status-left-length 50
set -g status-left "#[fg=#c13e26,bold] NOCTURNE #[default] #S "
set -g status-right "#[fg=#741c27] %H:%M  #[default]"
set -g message-style "bg=#741c27,fg=#e2d9c9"
set -g message-command-style "bg=#100b0b,fg=#c13e26"
set -g pane-border-style "fg=#741c27"
set -g pane-active-border-style "fg=#c13e26"
set -g window-style "bg=#100b0b,fg=#e2d9c9"
set -g window-active-style "bg=#100b0b,fg=#e2d9c9"
set -g window-status-style "bg=#100b0b,fg=#741c27"
set -g window-status-current-style "bg=#741c27,fg=#e2d9c9,bold"
set -g mode-style "bg=#c13e26,fg=#100b0b"
# Optional verified outer-terminal RGB declaration (replace terminal name):
# set -as terminal-features ",xterm-kitty:RGB"
