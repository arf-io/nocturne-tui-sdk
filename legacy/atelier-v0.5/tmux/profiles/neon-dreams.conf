# Nocturne / Neon Dreams. Static tmux styles; no automatic daemon or shell edit.
# Use in an isolated preview server first. Requires tmux with hex-color styles.
# RGB negotiation belongs to your actual outer terminal; see docs/TMUX.md.
set -g default-terminal "tmux-256color"
set -g mouse on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#100e1b,fg=#e2d9c9"
set -g status-left-length 50
set -g status-left "#[fg=#ff9966,bold] NOCTURNE #[default] #S "
set -g status-right "#[fg=#ec509d] %H:%M  #[default]"
set -g message-style "bg=#ec509d,fg=#e2d9c9"
set -g message-command-style "bg=#100e1b,fg=#ff9966"
set -g pane-border-style "fg=#ec509d"
set -g pane-active-border-style "fg=#ff9966"
set -g window-style "bg=#100e1b,fg=#e2d9c9"
set -g window-active-style "bg=#100e1b,fg=#e2d9c9"
set -g window-status-style "bg=#100e1b,fg=#ec509d"
set -g window-status-current-style "bg=#ec509d,fg=#e2d9c9,bold"
set -g mode-style "bg=#ff9966,fg=#100e1b"
# Optional verified outer-terminal RGB declaration (replace terminal name):
# set -as terminal-features ",xterm-kitty:RGB"
