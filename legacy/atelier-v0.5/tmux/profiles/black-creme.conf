# Nocturne / Black Creme. Static tmux styles; no automatic daemon or shell edit.
# Use in an isolated preview server first. Requires tmux with hex-color styles.
# RGB negotiation belongs to your actual outer terminal; see docs/TMUX.md.
set -g default-terminal "tmux-256color"
set -g mouse on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#11100e,fg=#e2d9c9"
set -g status-left-length 50
set -g status-left "#[fg=#9fb9b0,bold] NOCTURNE #[default] #S "
set -g status-right "#[fg=#b6a4c4] %H:%M  #[default]"
set -g message-style "bg=#b6a4c4,fg=#e2d9c9"
set -g message-command-style "bg=#11100e,fg=#9fb9b0"
set -g pane-border-style "fg=#b6a4c4"
set -g pane-active-border-style "fg=#9fb9b0"
set -g window-style "bg=#11100e,fg=#e2d9c9"
set -g window-active-style "bg=#11100e,fg=#e2d9c9"
set -g window-status-style "bg=#11100e,fg=#b6a4c4"
set -g window-status-current-style "bg=#b6a4c4,fg=#e2d9c9,bold"
set -g mode-style "bg=#9fb9b0,fg=#11100e"
# Optional verified outer-terminal RGB declaration (replace terminal name):
# set -as terminal-features ",xterm-kitty:RGB"
