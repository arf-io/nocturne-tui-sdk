# Standalone preview only; no daemon, shell hooks, or AFD writes.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB,screen*:RGB,tmux*:RGB'
set -g mouse on
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#101319,fg=#e2d9c9'
set -g pane-border-style 'fg=#253744'
set -g pane-active-border-style 'fg=#597589'
set -g message-style 'bg=#101319,fg=#597589'
set -g mode-style 'bg=#597589,fg=#101319'
set -g window-status-current-style 'fg=#101319,bg=#597589,bold'
set -g status-left-length 32
set -g status-left '#[fg=#597589] OBSERVATORY #[default] #S '
set -g status-right '#[fg=#597589] Winter #[default] %H:%M '
