# Standalone preview only; no daemon, shell hooks, or AFD writes.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB,screen*:RGB,tmux*:RGB'
set -g mouse on
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#11100e,fg=#e2d9c9'
set -g pane-border-style 'fg=#889eae'
set -g pane-active-border-style 'fg=#b7a7bf'
set -g message-style 'bg=#11100e,fg=#b7a7bf'
set -g mode-style 'bg=#b7a7bf,fg=#11100e'
set -g window-status-current-style 'fg=#11100e,bg=#b7a7bf,bold'
set -g status-left-length 32
set -g status-left '#[fg=#b7a7bf] OBSERVATORY #[default] #S '
set -g status-right '#[fg=#b7a7bf] Opal Interference #[default] %H:%M '
