# Standalone preview only; no daemon, shell hooks, or AFD writes.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB,screen*:RGB,tmux*:RGB'
set -g mouse on
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#100e1b,fg=#e2d9c9'
set -g pane-border-style 'fg=#693cc7'
set -g pane-active-border-style 'fg=#ec509d'
set -g message-style 'bg=#100e1b,fg=#ec509d'
set -g mode-style 'bg=#ec509d,fg=#100e1b'
set -g window-status-current-style 'fg=#100e1b,bg=#ec509d,bold'
set -g status-left-length 32
set -g status-left '#[fg=#ec509d] OBSERVATORY #[default] #S '
set -g status-right '#[fg=#ec509d] Neon Dreams #[default] %H:%M '
