# Standalone preview only; no daemon, shell hooks, or AFD writes.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB,screen*:RGB,tmux*:RGB'
set -g mouse on
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#141415,fg=#e2d9c9'
set -g pane-border-style 'fg=#414145'
set -g pane-active-border-style 'fg=#67676b'
set -g message-style 'bg=#141415,fg=#67676b'
set -g mode-style 'bg=#67676b,fg=#141415'
set -g window-status-current-style 'fg=#141415,bg=#67676b,bold'
set -g status-left-length 32
set -g status-left '#[fg=#67676b] OBSERVATORY #[default] #S '
set -g status-right '#[fg=#67676b] Millennial Gray #[default] %H:%M '
