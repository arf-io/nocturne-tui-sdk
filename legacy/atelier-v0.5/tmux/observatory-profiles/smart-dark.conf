# Standalone preview only; no daemon, shell hooks, or AFD writes.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB,screen*:RGB,tmux*:RGB'
set -g mouse on
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#111018,fg=#e2d9c9'
set -g pane-border-style 'fg=#31354f'
set -g pane-active-border-style 'fg=#655679'
set -g message-style 'bg=#111018,fg=#655679'
set -g mode-style 'bg=#655679,fg=#111018'
set -g window-status-current-style 'fg=#111018,bg=#655679,bold'
set -g status-left-length 32
set -g status-left '#[fg=#655679] OBSERVATORY #[default] #S '
set -g status-right '#[fg=#655679] Smart Dark #[default] %H:%M '
