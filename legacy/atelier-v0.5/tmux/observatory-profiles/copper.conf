# Standalone preview only; no daemon, shell hooks, or AFD writes.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB,screen*:RGB,tmux*:RGB'
set -g mouse on
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#11100e,fg=#e2d9c9'
set -g pane-border-style 'fg=#392824'
set -g pane-active-border-style 'fg=#714a38'
set -g message-style 'bg=#11100e,fg=#714a38'
set -g mode-style 'bg=#714a38,fg=#11100e'
set -g window-status-current-style 'fg=#11100e,bg=#714a38,bold'
set -g status-left-length 32
set -g status-left '#[fg=#714a38] OBSERVATORY #[default] #S '
set -g status-right '#[fg=#714a38] Copper After Hours #[default] %H:%M '
